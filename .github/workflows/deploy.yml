name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - wasm

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: "yarn"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: build
        working-directory: .
        run: |
          make wasm
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
